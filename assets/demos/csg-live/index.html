<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDF-CSG Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <section class="output-panel" aria-label="Render-Ausgabe">
      <header class="panel-header">
        <div>
          <h1>SDF-CSG</h1>
          <p id="mode-description">Union: Die jeweils kleinere Distanz gewinnt.</p>
        </div>
        <div class="formula" id="formula">min(d1, d2)</div>
      </header>

      <div class="viewport">
        <canvas id="csg-canvas" aria-label="Ray-Marching-Demo fuer SDF-CSG"></canvas>
        <div class="status" id="status">WebGL wird geladen...</div>
      </div>
    </section>

    <aside class="edit-panel" aria-label="CSG-Steuerung">
      <div class="button-row operations" role="group" aria-label="CSG-Operation">
        <button type="button" class="active" data-mode="0">Union</button>
        <button type="button" data-mode="1">Intersection</button>
        <button type="button" data-mode="2">Difference</button>
      </div>

      <div class="control-group">
        <label>
          Abstand der Formen
          <input id="shape-gap" type="range" min="0.25" max="1.15" value="0.58" step="0.01">
        </label>

        <label>
          Rotation
          <input id="rotation-angle" type="range" min="-3.14" max="3.14" value="0" step="0.01">
        </label>

        <label>
          Verschmelzung
          <input id="blend-amount" type="range" min="0" max="0.55" value="0" step="0.01">
        </label>

        <div class="object-toolbar">
          <span>Objekte</span>
          <button type="button" id="add-object" class="icon-button" aria-label="Objekt hinzufuegen">+</button>
        </div>
        <div class="object-list" id="object-list" aria-label="Primitive auswaehlen">
        </div>
      </div>

      <section class="function-panel" aria-label="SDF-Funktionen">
        <h2>Funktionen</h2>
        <article class="function-card">
          <h3>Kombination</h3>
          <pre id="function-combine"></pre>
        </article>
        <div id="primitive-functions"></div>
      </section>
    </aside>
  </main>

  <script src="demo.js"></script>
</body>
</html>
