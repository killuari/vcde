<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CSG Demo</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    color: #222;
  }

  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  canvas {
    border: 1px solid #ccc;
    background: #fafafa;
  }

  .controls {
    width: 280px;
  }

  label {
    display: block;
    margin-top: 14px;
  }

  input[type="range"],
  select {
    width: 100%;
  }

  .formula {
    margin-top: 18px;
    padding: 10px;
    background: #f2f2f2;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>

<body>

<div class="layout">
  <canvas id="canvas" width="620" height="420"></canvas>

  <div class="controls">
    <label>
      Operation:
      <select id="operation">
        <option value="union">Union</option>
        <option value="intersection">Intersection</option>
        <option value="difference">Difference A - B</option>
      </select>
    </label>

    <label>
      Abstand der Kreise:
      <input id="distance" type="range" min="40" max="220" value="120">
    </label>

    <label>
      Radius A:
      <input id="radiusA" type="range" min="40" max="130" value="90">
    </label>

    <label>
      Radius B:
      <input id="radiusB" type="range" min="40" max="130" value="90">
    </label>

    <div class="formula" id="formula"></div>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const operationSelect = document.getElementById("operation");
const distanceSlider = document.getElementById("distance");
const radiusASlider = document.getElementById("radiusA");
const radiusBSlider = document.getElementById("radiusB");
const formulaBox = document.getElementById("formula");

function length2(v) {
  return Math.sqrt(v.x * v.x + v.y * v.y);
}

function sdfCircle(p, center, radius) {
  return length2({
    x: p.x - center.x,
    y: p.y - center.y
  }) - radius;
}

function sceneSDF(p, centerA, centerB, radiusA, radiusB, operation) {
  const d1 = sdfCircle(p, centerA, radiusA);
  const d2 = sdfCircle(p, centerB, radiusB);

  if (operation === "union") {
    return Math.min(d1, d2);
  }

  if (operation === "intersection") {
    return Math.max(d1, d2);
  }

  if (operation === "difference") {
    return Math.max(d1, -d2);
  }

  return d1;
}

function drawGridSDF(centerA, centerB, radiusA, radiusB, operation) {
  const cellSize = 2;

  for (let y = 0; y < canvas.height; y += cellSize) {
    for (let x = 0; x < canvas.width; x += cellSize) {
      const p = { x, y };
      const d = sceneSDF(p, centerA, centerB, radiusA, radiusB, operation);

      if (d < 0) {
        ctx.fillStyle = "rgba(25, 118, 210, 0.28)";
      } else {
        const intensity = Math.max(0, 245 - Math.min(d * 2, 120));
        ctx.fillStyle = `rgb(${intensity}, ${intensity}, ${intensity})`;
      }

      ctx.fillRect(x, y, cellSize, cellSize);
    }
  }
}

function drawZeroLevelSet(centerA, centerB, radiusA, radiusB, operation) {
  const cellSize = 2;

  ctx.fillStyle = "#111";

  for (let y = 0; y < canvas.height; y += cellSize) {
    for (let x = 0; x < canvas.width; x += cellSize) {
      const p = { x, y };
      const d = sceneSDF(p, centerA, centerB, radiusA, radiusB, operation);

      if (Math.abs(d) < 2.2) {
        ctx.fillRect(x, y, cellSize, cellSize);
      }
    }
  }
}

function drawOriginalCircles(centerA, centerB, radiusA, radiusB) {
  ctx.setLineDash([6, 6]);
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.arc(centerA.x, centerA.y, radiusA, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(198, 40, 40, 0.8)";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(centerB.x, centerB.y, radiusB, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(46, 125, 50, 0.8)";
  ctx.stroke();

  ctx.setLineDash([]);
}

function updateFormula(operation) {
  if (operation === "union") {
    formulaBox.innerHTML = "Union:<br>d = min(d1, d2)";
  }

  if (operation === "intersection") {
    formulaBox.innerHTML = "Intersection:<br>d = max(d1, d2)";
  }

  if (operation === "difference") {
    formulaBox.innerHTML = "Difference A - B:<br>d = max(d1, -d2)";
  }
}

function draw() {
  const operation = operationSelect.value;
  const distance = Number(distanceSlider.value);
  const radiusA = Number(radiusASlider.value);
  const radiusB = Number(radiusBSlider.value);

  const center = { x: canvas.width / 2, y: canvas.height / 2 };

  const centerA = {
    x: center.x - distance / 2,
    y: center.y
  };

  const centerB = {
    x: center.x + distance / 2,
    y: center.y
  };

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawGridSDF(centerA, centerB, radiusA, radiusB, operation);
  drawZeroLevelSet(centerA, centerB, radiusA, radiusB, operation);
  drawOriginalCircles(centerA, centerB, radiusA, radiusB);
  updateFormula(operation);
}

[
  operationSelect,
  distanceSlider,
  radiusASlider,
  radiusBSlider
].forEach(input => {
  input.addEventListener("input", draw);
  input.addEventListener("change", draw);
});

draw();
</script>

</body>
</html>
