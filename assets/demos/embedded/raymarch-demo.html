<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ray Marching Demo</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    color: #222;
  }

  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  canvas {
    border: 1px solid #ccc;
    background: #fafafa;
  }

  .controls {
    width: 260px;
  }

  label {
    display: block;
    margin-top: 14px;
  }

  input {
    width: 100%;
  }
</style>
</head>

<body>

<div class="layout">
  <canvas id="canvas" width="620" height="420"></canvas>

  <div class="controls">
    <label>
      Kreisradius:
      <input id="radius" type="range" min="40" max="150" value="90">
    </label>

    <label>
      Ray-Winkel:
      <input id="angle" type="range" min="-35" max="35" value="0">
    </label>

    <label>
      Max Steps:
      <input id="maxSteps" type="range" min="1" max="25" value="10">
    </label>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const radiusSlider = document.getElementById("radius");
const angleSlider = document.getElementById("angle");
const maxStepsSlider = document.getElementById("maxSteps");

const EPSILON = 1.0;
const MAX_DISTANCE = 1000.0;

function sdfCircle(p, center, radius) {
  const dx = p.x - center.x;
  const dy = p.y - center.y;
  return Math.sqrt(dx * dx + dy * dy) - radius;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const center = { x: 420, y: 210 };
  const radius = Number(radiusSlider.value);
  const maxSteps = Number(maxStepsSlider.value);

  const rayOrigin = { x: 60, y: 210 };
  const angle = Number(angleSlider.value) * Math.PI / 180;

  const rayDir = {
    x: Math.cos(angle),
    y: Math.sin(angle)
  };

  // Objekt zeichnen
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  ctx.stroke();

  let p = { ...rayOrigin };
  let totalDistance = 0.0;
  let hit = false;

  const points = [{ ...p }];

  for (let i = 0; i < maxSteps; i++) {
    const d = sdfCircle(p, center, radius);

    // Distanzkreis zeichnen
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.abs(d), 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(25, 118, 210, 0.35)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Abtastpunkt zeichnen
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#d32f2f";
    ctx.fill();

    if (d < EPSILON) {
      hit = true;
      break;
    }

    totalDistance += d;

    if (totalDistance > MAX_DISTANCE) {
      break;
    }

    p = {
      x: p.x + rayDir.x * d,
      y: p.y + rayDir.y * d
    };

    points.push({ ...p });

    if (p.x < -200 || p.x > canvas.width + 200 || p.y < -200 || p.y > canvas.height + 200) {
      break;
    }
  }

  // Ray-Linie entlang der tatsächlichen Marching-Schritte zeichnen
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (const point of points) {
    ctx.lineTo(point.x, point.y);
  }

  ctx.strokeStyle = "#c62828";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Endpunkt hervorheben
  const lastPoint = points[points.length - 1];

  ctx.beginPath();
  ctx.arc(lastPoint.x, lastPoint.y, 7, 0, Math.PI * 2);
  ctx.fillStyle = hit ? "#2e7d32" : "#d32f2f";
  ctx.fill();
}

[radiusSlider, angleSlider, maxStepsSlider].forEach(slider => {
  slider.addEventListener("input", draw);
});

draw();
</script>

</body>
</html>
