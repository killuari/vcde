<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDF einer Kugel</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 14px 16px;
    color: #222;
  }
  .ctrl-label {
    font-size: 0.75rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.15rem;
  }
  .info-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #8b949e;
    margin-bottom: 0.35rem;
  }
  input[type="range"] { accent-color: #4a90d9; }
</style>
</head>
<body>
<div style="display:flex; flex-wrap:wrap; gap:2rem; align-items:flex-start;">

  <canvas id="canvas" width="480" height="360"
          style="border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.22); max-width:100%;">
  </canvas>

  <div style="display:flex; flex-direction:column; gap:1.2rem; min-width:220px; flex:1; max-width:340px; padding-top:0.3rem;">

    <div>
      <div class="ctrl-label">Radius r: <strong style="color:#222;" id="val-r">100</strong></div>
      <input type="range" id="sl-r" min="40" max="150" value="100" style="width:100%; margin-top:0.3rem;">
    </div>

    <div>
      <div class="ctrl-label">Punkt p.x: <strong style="color:#222;" id="val-px">160</strong></div>
      <input type="range" id="sl-px" min="-220" max="220" value="160" style="width:100%; margin-top:0.3rem;">
    </div>

    <div>
      <div class="ctrl-label">Punkt p.y: <strong style="color:#222;" id="val-py">0</strong></div>
      <input type="range" id="sl-py" min="-160" max="160" value="0" style="width:100%; margin-top:0.3rem;">
    </div>

    <!-- Formula -->
    <div style="background:#0d1117; border-radius:8px; padding:0.75rem 1rem;">
      <div class="info-label">SDF-Formel</div>
      <div style="color:#e6edf3; font-size:0.9rem; line-height:1.7;">
        f(<b>p</b>) = &#x2016;<b>p</b> &minus; <b>c</b>&#x2016; &minus; r
      </div>
    </div>

    <!-- Computed values -->
    <div id="value-box" style="background:#0d1117; border-radius:8px; padding:0.75rem 1rem;
         color:#e6edf3; font-size:0.83rem; line-height:1.9; font-family:monospace;">
    </div>

  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const slR  = document.getElementById('sl-r');
const slPx = document.getElementById('sl-px');
const slPy = document.getElementById('sl-py');

function draw() {
    const r   = Number(slR.value);
    const cx  = W / 2, cy = H / 2;
    const px  = cx + Number(slPx.value);
    const py  = cy + Number(slPy.value);
    const dx  = px - cx, dy = py - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const sdf  = dist - r;

    document.getElementById('val-r').textContent  = r;
    document.getElementById('val-px').textContent = Number(slPx.value);
    document.getElementById('val-py').textContent = Number(slPy.value);

    // Background + grid
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth   = 1;
    for (let gx = 0; gx <= W; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for (let gy = 0; gy <= H; gy += 40) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    // Sphere fill + stroke
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(70,110,160,0.22)';
    ctx.fill();
    ctx.strokeStyle = '#5588bb';
    ctx.lineWidth   = 2;
    ctx.stroke();

    // f(p)=0 label on sphere
    ctx.fillStyle = '#7799cc';
    ctx.font      = '12px monospace';
    ctx.fillText('f(p) = 0', cx + r + 6, cy - 6);

    // Arrow from center c to point p
    const arrowLen = dist;
    if (arrowLen > 2) {
        const ux = dx / arrowLen, uy = dy / arrowLen;
        const tipX = cx + ux * arrowLen, tipY = cy + uy * arrowLen;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(tipX, tipY);
        ctx.strokeStyle = '#ffcc33';
        ctx.lineWidth   = 1.8;
        ctx.stroke();
        const headLen = 9;
        const angle   = Math.atan2(uy, ux);
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - headLen * Math.cos(angle - Math.PI/6), tipY - headLen * Math.sin(angle - Math.PI/6));
        ctx.lineTo(tipX - headLen * Math.cos(angle + Math.PI/6), tipY - headLen * Math.sin(angle + Math.PI/6));
        ctx.closePath();
        ctx.fillStyle = '#ffcc33';
        ctx.fill();
    }

    // Distance circle around p (|sdf| radius)
    if (Math.abs(sdf) > 1) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, Math.abs(sdf), 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(50,210,230,0.45)';
        ctx.lineWidth   = 1.5;
        ctx.setLineDash([5, 3]);
        ctx.stroke();
        ctx.restore();
    }

    // Center dot c
    ctx.fillStyle = '#aaccee';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#99bbdd';
    ctx.font      = '13px monospace';
    ctx.fillText('c', cx + 7, cy + 15);

    // Point p
    const insideColor  = sdf < 0 ? '#59b8ff' : '#ffcc33';
    ctx.fillStyle = insideColor;
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = sdf < 0 ? '#3388cc' : '#cc9900';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#c9d1d9';
    ctx.font      = '13px monospace';
    ctx.fillText('p', px + 9, py - 8);

    // Distance label on arrow
    if (arrowLen > 40) {
        const midX = cx + dx * 0.5, midY = cy + dy * 0.5;
        ctx.fillStyle = 'rgba(255,204,51,0.85)';
        ctx.font      = '11px monospace';
        ctx.fillText('‖p−c‖=' + dist.toFixed(0), midX + 6, midY - 4);
    }

    // Value box
    const sign  = sdf < 0 ? '&minus;' : '+';
    const color = sdf < 0 ? '#59b8ff' : '#ffcc33';
    const msg   = sdf < 0
        ? 'p liegt <b style="color:#59b8ff">innerhalb</b>'
        : Math.abs(sdf) < 2
            ? 'p liegt <b style="color:#44ff88">auf der Oberfläche</b>'
            : 'p liegt <b style="color:#ffcc33">außerhalb</b>';

    document.getElementById('value-box').innerHTML =
        '<span style="color:#8b949e">‖p − c‖</span> = ' + dist.toFixed(1) + '<br>' +
        '<span style="color:#8b949e">r</span>       = ' + r + '<br>' +
        '<span style="color:#8b949e">f(p)</span>    = ' + dist.toFixed(1) + ' − ' + r + ' = ' +
        '<b style="color:' + color + '">' + sdf.toFixed(1) + '</b><br><br>' +
        msg;
}

[slR, slPx, slPy].forEach(function(sl) { sl.addEventListener('input', draw); });
draw();
</script>
</body>
</html>
