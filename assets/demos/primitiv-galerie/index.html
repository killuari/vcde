<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primitiv-Galerie</title>
  <script src="https://cdn.jsdelivr.net/npm/glslCanvas@0.2.6/dist/GlslCanvas.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px 16px; color: #222; }
    .ctrl-btn {
      padding: 0.3rem 0.9rem;
      border-radius: 6px;
      border: 2px solid #3a4250;
      background: #1b1f27;
      color: #d3d9e2;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: system-ui, sans-serif;
    }
    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b949e;
      margin-bottom: 0.35rem;
    }
  </style>
  <link rel="stylesheet" href="../demo-dark.css">
</head>
<body>
  <div style="margin:0.4rem 0;">

    <div style="display:flex; gap:0.45rem; margin-bottom:1rem; flex-wrap:wrap; align-items:center;">
      <strong style="color:#555; font-size:0.9rem;">Form:</strong>
      <button id="btn-shape-0" class="ctrl-btn" style="background:#4a90d9;color:#fff;border-color:#4a90d9;" onclick="setShape(0)">Kugel</button>
      <button id="btn-shape-1" class="ctrl-btn" onclick="setShape(1)">Box</button>
      <button id="btn-shape-2" class="ctrl-btn" onclick="setShape(2)">Torus</button>
      <button id="btn-shape-3" class="ctrl-btn" onclick="setShape(3)">Kapsel</button>
      <button id="btn-shape-4" class="ctrl-btn" onclick="setShape(4)">Zylinder</button>
      <button id="btn-shape-5" class="ctrl-btn" onclick="setShape(5)">Oktaeder</button>
    </div>

    <div style="display:flex; flex-wrap:wrap; gap:2rem; align-items:flex-start;">

      <canvas id="canvas" width="360" height="360"
              style="border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.3); flex-shrink:0;">
      </canvas>

      <div id="ctrl-panel" style="display:flex; flex-direction:column; gap:1.1rem; min-width:220px; flex:1; max-width:360px; padding-top:0.4rem;">

        <div>
          <label><strong id="label-p1">Radius</strong>: <span id="val-p1">0.60</span></label><br>
          <input type="range" id="sl-p1" min="0.1" max="1.2" step="0.01" value="0.6"
                 style="width:100%; margin-top:0.4rem; accent-color:#4a90d9;">
        </div>

        <div id="p2-group" style="display:none;">
          <label><strong id="label-p2">-</strong>: <span id="val-p2">-</span></label><br>
          <input type="range" id="sl-p2" min="0.05" max="1.2" step="0.01" value="0.4"
                 style="width:100%; margin-top:0.4rem; accent-color:#4a90d9;">
        </div>

        <!-- Formula -->
        <div style="background:#0d1117; border-radius:8px; padding:0.75rem 1rem;">
          <div class="info-label">SDF-Formel</div>
          <div id="formula-display" style="color:#e6edf3; font-size:0.9rem; line-height:1.7;"></div>
        </div>

        <!-- GLSL Code -->
        <div style="background:#0d1117; border-radius:8px; padding:0.75rem 1rem;">
          <div class="info-label">GLSL-Implementierung</div>
          <pre id="code-display"
               style="margin:0; font-size:0.73rem; line-height:1.52;
                      overflow-x:auto; white-space:pre; color:#e6edf3;
                      scrollbar-color:#30363d #0d1117;"></pre>
        </div>

      </div>
    </div>
  </div>

  <script src="demo.js"></script>
</body>
</html>
