<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ray-Marching Visualisierer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; color: #222; }
  </style>
</head>
<body>
  <div style="margin:1rem 0;">

    <div style="display:flex; flex-wrap:wrap; gap:1.5rem; align-items:center; margin-bottom:1.2rem;">
      <div>
        <label><strong>Sichtbare Schritte</strong>: <span id="val-steps">0</span></label><br>
        <input type="range" id="sl-steps" min="0" max="20" step="1" value="0"
               style="width:220px; margin-top:0.4rem;">
      </div>
      <button id="btn-play"
              style="padding:0.4rem 1.2rem; border-radius:6px; border:2px solid #44aa66;
                     background:#44aa66; color:#fff; cursor:pointer; font-size:1rem;">
        &#9654; Play
      </button>
    </div>

    <canvas id="canvas" width="520" height="370"
            style="border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.4); max-width:100%;">
    </canvas>

  </div>

  <script src="demo.js"></script>
</body>
</html>
