<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDF-Distanzfeld (2D Heatmap)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px 16px; color: #222; }
    .ctrl-btn {
      padding: 0.3rem 0.9rem;
      border-radius: 6px;
      border: 2px solid #3a4250;
      background: #1b1f27;
      color: #d3d9e2;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: system-ui, sans-serif;
    }
    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b949e;
      margin-bottom: 0.35rem;
    }
  </style>
  <link rel="stylesheet" href="../demo-dark.css">
</head>
<body>
  <div style="margin:0.4rem 0;">

    <div style="display:flex; gap:0.45rem; margin-bottom:1.1rem; flex-wrap:wrap; align-items:center;">
      <strong style="color:#555; font-size:0.9rem;">Form:</strong>
      <button id="btn-shape-0" class="ctrl-btn" style="background:#4a90d9;color:#fff;border-color:#4a90d9;" onclick="setShape(0)">Kugel</button>
      <button id="btn-shape-1" class="ctrl-btn" onclick="setShape(1)">Box</button>
      <button id="btn-shape-2" class="ctrl-btn" onclick="setShape(2)">Torus</button>
      <button id="btn-shape-3" class="ctrl-btn" onclick="setShape(3)">Kapsel</button>
      <button id="btn-shape-4" class="ctrl-btn" onclick="setShape(4)">Zylinder</button>
      <button id="btn-shape-5" class="ctrl-btn" onclick="setShape(5)">Oktaeder</button>
    </div>

    <div style="display:flex; flex-wrap:wrap; gap:2rem; align-items:flex-start;">

      <canvas id="canvas" width="400" height="400"
              style="border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.22); max-width:100%;">
      </canvas>

      <div style="display:flex; flex-direction:column; gap:1.3rem; min-width:210px; padding-top:0.4rem;">

        <div>
          <label><strong id="label-p1">Radius</strong>: <span id="val-p1">80</span> px</label><br>
          <input type="range" id="sl-p1" min="10" max="170" step="1" value="80"
                 style="width:100%; margin-top:0.4rem; accent-color:#4a90d9;">
        </div>

        <div id="p2-group" style="display:none;">
          <label><strong id="label-p2">Halbhöhe</strong>: <span id="val-p2">60</span> px</label><br>
          <input type="range" id="sl-p2" min="5" max="170" step="1" value="60"
                 style="width:100%; margin-top:0.4rem; accent-color:#4a90d9;">
        </div>

        <div>
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="checkbox" id="cb-iso" style="accent-color:#4a90d9;">
            Iso-Konturlinien
          </label>
        </div>

        <div style="font-size:0.84rem; line-height:2.1; color:#444;">
          <div><span id="swatch-inside" style="display:inline-block;width:14px;height:14px;background:#59b8ff;
                            border-radius:3px;vertical-align:middle;margin-right:6px;"></span>d &lt; 0 - innen</div>
          <div><span style="display:inline-block;width:14px;height:14px;background:#ffffff;
                            border:1px solid #ccc;border-radius:3px;vertical-align:middle;margin-right:6px;"></span>d = 0 - Oberfläche</div>
          <div><span style="display:inline-block;width:14px;height:14px;background:#334466;
                            border-radius:3px;vertical-align:middle;margin-right:6px;"></span>d &gt; 0 - außen</div>
        </div>

        <div style="background:#0d1117; border-radius:8px; padding:0.8rem 1rem;">
          <div class="info-label">SDF-Formel</div>
          <div id="formula-display" style="color:#e6edf3; font-size:0.95rem; line-height:1.7;"></div>
        </div>

        <div style="background:#0d1117; border-radius:8px; padding:0.8rem 1rem;">
          <div class="info-label">Parameter</div>
          <div id="param-display" style="color:#c7cbd2; font-size:0.85rem; line-height:1.7;"></div>
        </div>

      </div>
    </div>

  </div>

  <script src="demo.js"></script>
</body>
</html>
