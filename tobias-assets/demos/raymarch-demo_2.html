<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ray Marching Demo</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    color: #222;
  }

  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  canvas {
    border: 1px solid #ccc;
    background: #fafafa;
  }

  .controls {
    width: 260px;
  }

  label {
    display: block;
    margin-top: 14px;
  }

  input[type="range"] {
    width: 100%;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>

<body>

<div class="layout">
  <canvas id="canvas" width="620" height="420"></canvas>

  <div class="controls">
    <label>
      Kreisradius:
      <input id="radius" type="range" min="40" max="150" value="90">
    </label>

    <label>
      Ray-Winkel:
      <input id="angle" type="range" min="-35" max="35" value="0">
    </label>

    <label>
      Max Steps:
      <input id="maxSteps" type="range" min="1" max="25" value="10">
    </label>

    <label class="check">
      <input id="showBox" type="checkbox" checked>
      Rechteck anzeigen
    </label>

    <label class="check">
      <input id="showTriangle" type="checkbox" checked>
      Dreieck anzeigen
    </label>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const radiusSlider = document.getElementById("radius");
const angleSlider = document.getElementById("angle");
const maxStepsSlider = document.getElementById("maxSteps");
const showBoxCheckbox = document.getElementById("showBox");
const showTriangleCheckbox = document.getElementById("showTriangle");

const EPSILON = 1.0;
const MAX_DISTANCE = 1000.0;

function length2(v) {
  return Math.sqrt(v.x * v.x + v.y * v.y);
}

function clamp(x, a, b) {
  return Math.max(a, Math.min(b, x));
}

function sdfCircle(p, center, radius) {
  return length2({
    x: p.x - center.x,
    y: p.y - center.y
  }) - radius;
}

function sdfBox(p, center, halfSize) {
  const q = {
    x: Math.abs(p.x - center.x) - halfSize.x,
    y: Math.abs(p.y - center.y) - halfSize.y
  };

  const outside = {
    x: Math.max(q.x, 0.0),
    y: Math.max(q.y, 0.0)
  };

  const outsideDistance = length2(outside);
  const insideDistance = Math.min(Math.max(q.x, q.y), 0.0);

  return outsideDistance + insideDistance;
}

function distanceToSegment(p, a, b) {
  const pa = {
    x: p.x - a.x,
    y: p.y - a.y
  };

  const ba = {
    x: b.x - a.x,
    y: b.y - a.y
  };

  const h = clamp(
    (pa.x * ba.x + pa.y * ba.y) / (ba.x * ba.x + ba.y * ba.y),
    0.0,
    1.0
  );

  return length2({
    x: pa.x - ba.x * h,
    y: pa.y - ba.y * h
  });
}

function pointInTriangle(p, a, b, c) {
  const d1 = sign(p, a, b);
  const d2 = sign(p, b, c);
  const d3 = sign(p, c, a);

  const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);

  return !(hasNeg && hasPos);
}

function sign(p1, p2, p3) {
  return (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
}

function sdfTriangle(p, a, b, c) {
  const d = Math.min(
    distanceToSegment(p, a, b),
    distanceToSegment(p, b, c),
    distanceToSegment(p, c, a)
  );

  return pointInTriangle(p, a, b, c) ? -d : d;
}

function sceneSDF(p, scene) {
  let d = sdfCircle(p, scene.circleCenter, scene.circleRadius);

  if (showBoxCheckbox.checked) {
    const boxDistance = sdfBox(p, scene.boxCenter, scene.boxHalfSize);
    d = Math.min(d, boxDistance);
  }

  if (showTriangleCheckbox.checked) {
    const triangleDistance = sdfTriangle(
      p,
      scene.triangleA,
      scene.triangleB,
      scene.triangleC
    );
    d = Math.min(d, triangleDistance);
  }

  return d;
}

function drawScene(scene) {
  ctx.beginPath();
  ctx.arc(
    scene.circleCenter.x,
    scene.circleCenter.y,
    scene.circleRadius,
    0,
    Math.PI * 2
  );
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  ctx.stroke();

  if (showBoxCheckbox.checked) {
    ctx.beginPath();
    ctx.rect(
      scene.boxCenter.x - scene.boxHalfSize.x,
      scene.boxCenter.y - scene.boxHalfSize.y,
      scene.boxHalfSize.x * 2,
      scene.boxHalfSize.y * 2
    );
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  if (showTriangleCheckbox.checked) {
    ctx.beginPath();
    ctx.moveTo(scene.triangleA.x, scene.triangleA.y);
    ctx.lineTo(scene.triangleB.x, scene.triangleB.y);
    ctx.lineTo(scene.triangleC.x, scene.triangleC.y);
    ctx.closePath();
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const scene = {
    circleCenter: { x: 430, y: 210 },
    circleRadius: Number(radiusSlider.value),

    boxCenter: { x: 300, y: 120 },
    boxHalfSize: { x: 55, y: 40 },

    triangleA: { x: 280, y: 300 },
    triangleB: { x: 380, y: 270 },
    triangleC: { x: 350, y: 365 }
  };

  const maxSteps = Number(maxStepsSlider.value);
  const rayOrigin = { x: 60, y: 210 };
  const angle = Number(angleSlider.value) * Math.PI / 180;

  const rayDir = {
    x: Math.cos(angle),
    y: Math.sin(angle)
  };

  drawScene(scene);

  let p = { ...rayOrigin };
  let totalDistance = 0.0;
  let hit = false;

  const points = [{ ...p }];

  for (let i = 0; i < maxSteps; i++) {
    const d = sceneSDF(p, scene);

    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.abs(d), 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(25, 118, 210, 0.35)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#d32f2f";
    ctx.fill();

    if (d < EPSILON) {
      hit = true;
      break;
    }

    totalDistance += d;

    if (totalDistance > MAX_DISTANCE) {
      break;
    }

    p = {
      x: p.x + rayDir.x * d,
      y: p.y + rayDir.y * d
    };

    points.push({ ...p });

    if (
      p.x < -200 ||
      p.x > canvas.width + 200 ||
      p.y < -200 ||
      p.y > canvas.height + 200
    ) {
      break;
    }
  }

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (const point of points) {
    ctx.lineTo(point.x, point.y);
  }

  ctx.strokeStyle = "#c62828";
  ctx.lineWidth = 2;
  ctx.stroke();

  const lastPoint = points[points.length - 1];

  ctx.beginPath();
  ctx.arc(lastPoint.x, lastPoint.y, 7, 0, Math.PI * 2);
  ctx.fillStyle = hit ? "#2e7d32" : "#d32f2f";
  ctx.fill();
}

[
  radiusSlider,
  angleSlider,
  maxStepsSlider,
  showBoxCheckbox,
  showTriangleCheckbox
].forEach(input => {
  input.addEventListener("input", draw);
  input.addEventListener("change", draw);
});

draw();
</script>

</body>
</html>
