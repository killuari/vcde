<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SDF einer Kugel</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    color: #222;
  }

  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  canvas {
    border: 1px solid #ccc;
    background: #fafafa;
  }

  .controls {
    width: 280px;
  }

  label {
    display: block;
    margin-top: 14px;
  }

  input[type="range"] {
    width: 100%;
  }

  .value-box {
    margin-top: 18px;
    padding: 10px;
    background: #f2f2f2;
    border-radius: 6px;
    line-height: 1.5;
  }
</style>
</head>

<body>

<div class="layout">
  <canvas id="canvas" width="620" height="420"></canvas>

  <div class="controls">
    <label>
      Radius r:
      <input id="radius" type="range" min="40" max="150" value="100">
    </label>

    <label>
      Punkt x:
      <input id="pointX" type="range" min="-250" max="250" value="160">
    </label>

    <label>
      Punkt y:
      <input id="pointY" type="range" min="-160" max="160" value="0">
    </label>

    <div class="value-box" id="valueBox"></div>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const radiusSlider = document.getElementById("radius");
const pointXSlider = document.getElementById("pointX");
const pointYSlider = document.getElementById("pointY");
const valueBox = document.getElementById("valueBox");

function length2(v) {
  return Math.sqrt(v.x * v.x + v.y * v.y);
}

function sdfCircle(p, center, radius) {
  return length2({
    x: p.x - center.x,
    y: p.y - center.y
  }) - radius;
}

function drawArrow(from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const len = Math.sqrt(dx * dx + dy * dy);

  if (len < 0.001) return;

  const dir = {
    x: dx / len,
    y: dy / len
  };

  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(to.x, to.y);
  ctx.strokeStyle = "#666";
  ctx.lineWidth = 2;
  ctx.stroke();

  const angle = Math.atan2(dir.y, dir.x);
  const headLength = 9;

  ctx.beginPath();
  ctx.moveTo(to.x, to.y);
  ctx.lineTo(
    to.x - headLength * Math.cos(angle - Math.PI / 6),
    to.y - headLength * Math.sin(angle - Math.PI / 6)
  );
  ctx.lineTo(
    to.x - headLength * Math.cos(angle + Math.PI / 6),
    to.y - headLength * Math.sin(angle + Math.PI / 6)
  );
  ctx.closePath();
  ctx.fillStyle = "#666";
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const center = {
    x: canvas.width / 2,
    y: canvas.height / 2
  };

  const radius = Number(radiusSlider.value);

  const point = {
    x: center.x + Number(pointXSlider.value),
    y: center.y + Number(pointYSlider.value)
  };

  const distanceToCenter = length2({
    x: point.x - center.x,
    y: point.y - center.y
  });

  const sdfValue = sdfCircle(point, center, radius);

  // Innenbereich der Kugel
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(25, 118, 210, 0.15)";
  ctx.fill();

  // Oberfläche f(p)=0
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Mittelpunkt
  ctx.beginPath();
  ctx.arc(center.x, center.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#111";
  ctx.fill();

  // Label c für den Mittelpunkt
  ctx.fillStyle = "#222";
  ctx.font = "14px system-ui";
  ctx.fillText("c", center.x + 8, center.y + 18);

  // Linie vom Mittelpunkt zum Punkt
  drawArrow(center, point);

  // Abstandskreis um den Punkt: Radius = |SDF|
  ctx.beginPath();
  ctx.arc(point.x, point.y, Math.abs(sdfValue), 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(198, 40, 40, 0.35)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Punkt p
  ctx.beginPath();
  ctx.arc(point.x, point.y, 7, 0, Math.PI * 2);
  ctx.fillStyle = sdfValue < 0 ? "#1565c0" : "#c62828";
  ctx.fill();

  // Label p
  ctx.fillStyle = "#222";
  ctx.font = "14px system-ui";
  ctx.fillText("p", point.x + 10, point.y - 10);

  // Kurze Anzeige direkt im Canvas
  ctx.fillStyle = "#222";
  ctx.fillText("f(p) = 0", center.x + radius + 10, center.y - 8);

  valueBox.innerHTML =
    `<strong>Formel:</strong><br>` +
    `f(p) = ||p - c|| - r<br><br>` +
    `<strong>Aktuelle Werte:</strong><br>` +
    `||p - c|| = ${distanceToCenter.toFixed(2)}<br>` +
    `r = ${radius.toFixed(2)}<br>` +
    `f(p) = ${distanceToCenter.toFixed(2)} - ${radius.toFixed(2)} = <strong>${sdfValue.toFixed(2)}</strong><br><br>` +
    `<strong>Interpretation:</strong><br>` +
    `${sdfValue < 0
      ? "Der Punkt liegt innerhalb der Kugel."
      : Math.abs(sdfValue) < 1
        ? "Der Punkt liegt ungefähr auf der Oberfläche."
        : "Der Punkt liegt außerhalb der Kugel."}`;
}

[radiusSlider, pointXSlider, pointYSlider].forEach(input => {
  input.addEventListener("input", draw);
});

draw();
</script>

</body>
</html>
